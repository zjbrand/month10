<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    input {
      border: 2px solid;
      margin-top: 50px;
      height: 25px;
    }

    input:focus {
      border: 4px solid skyblue;
    }

    span {
      color: red;
    }
  </style>
</head>

<body>
  <h1>検索ページ提出</h1>
  <form action="showParameter.html" method="get" onsubmit="return validOrNot()">
    名前<input type="text" class="inputSearch" name="searchName">
    <br>
    <span>1</span>
    <br>
    検索範囲<input type="text" class="inputSearch" placeholder="2000-01-01" name="dateBegin">から
    <input type="text" class="inputSearch" placeholder="2000-01-01" name="dateEnd">まで
    <input type="submit" value="検索">
    <br>
    <span>2</span><span>3</span>
  </form>

  <script>
    let inputSearch = document.querySelectorAll(".inputSearch")

    let span = document.querySelectorAll("span")
    // inputSearch[0] searchName span[0]
    // inputSearch[1] dateBegin  span[1]
    // inputSearch[2] dateEnd    span[2]

    function checkName(searchName) {
      //let regxName = /^[0-9a-zA-Z_]{4,10}$/
      let regxName = /^\w{4,10}$/
      if (regxName.test(searchName)) {
        span[0].innerHTML = `正しい名前を入力している。`
        setTimeout(() => {
          span[0].innerHTML = ''
        }, 3000)
        return true
      } else {
        span[0].innerHTML = "誤っている名前を入力している。"
        setTimeout(() => {
          span[0].innerHTML = ''
          inputSearch[0].value = ''
        }, 3000)
        return false
      }
    }

    function checkDate(dateBegin, dateEnd) {
      //1920 19||20
      //01 02 10 11 12
      //31 01 10 20
      let regxDate = /^(19|20)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/
      if (regxDate.test(dateBegin) && regxDate.test(dateEnd)) {

        return true
      } else if (!regxDate.test(dateBegin)) {
        span[1].innerHTML = "誤っている開始時間を入力している。"
        setTimeout(() => {
          span[1].innerHTML = ''
          inputSearch[1].value = ''
        }, 3000)
        return false

      } else if (!regxDate.test(dateEnd)) {
        span[2].innerHTML = "誤っている終了時間を入力している。"
        setTimeout(() => {
          span[2].innerHTML = ''
          inputSearch[2].value = ''
        }, 3000)
        return false
      }
    }

    function validOrNot() {
      let searchName = inputSearch[0].value
      let dateBegin = inputSearch[1].value
      let dateEnd = inputSearch[2].value

      if (checkName(searchName) && checkDate(dateBegin, dateEnd)) {
        return true
      } else {
        return false
      }

    }


  </script>
</body>

</html>
