<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 700px;
      height: 300px;
      border-left: 2px solid skyblue;
      border-bottom: 2px solid skyblue;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      margin: 50px auto;
      text-align: center;
    }

    /* 直下の子セレクター */
    .box>div {
      display: flex;
      width: 50px;
      background-color: skyblue;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 子孫セレクター */
    .box div span {
      margin-top: -20px;
    }

    .box div h4 {
      margin-bottom: -40px;
      margin-left: -13px;
      width: 80px;
    }
  </style>
</head>

<body>



  <script>
    document.write("<h1>×××××株式会社の売上図</h1>")
    let arr = []
    for (let i = 1; i <= 4; i++) {
      //0,1,2,3 1234
      let pp = +prompt(`第${i}四半期の値を入力してください`)
      arr.push(pp)
    }
