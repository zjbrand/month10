<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .clock {
      position: relative;
      width: 400px;
      height: 400px;
      border: 1px solid;
      border-radius: 50%;
    }

    .tick {
      position: absolute;
      width: 2px;
      height: 100%;
      left: 50%;
    }

    .tick::before {
      content: "";
      display: block;
      width: 2px;
      height: 9px;
      background: red
    }

    .tick.major::before {
      width: 3px;
      height: 15px;
      background: #334155;
    }

    /* 時計の中心 */
    .clock-center {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ef4444;
      border: 4px solid white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      box-shadow: 0 0 4px #888;
    }
  </style>
</head>

<body>
  <div class="clock">
    <div class="clock-center"></div>
  </div>
  <script>
    const clock = document.querySelector(".clock")

    for (let i = 0; i < 20; i++) {
      const tick = document.createElement("div")
      tick.classList.add("tick")
      tick.style.transform = `translateX(-50%) rotate(${i * 6}deg)`

      if (i % 5 === 0) {
        tick.classList.add("major")
      }

      clock.appendChild(tick)
    }


  </script>
</body>

</html>
