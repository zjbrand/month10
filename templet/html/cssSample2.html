<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: #f3f3f3;
    }

    .title {
      color: #2c3e50;
      font-size: 36px;
      text-align: center;
    }

    .message {
      color: #333;
      font-size: 18px;
      background-color: white;
      padding: 20px;
    }

    .btn {
      background-color: #3496d9;
      color: white;
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #217dbb;
    }
  </style>


</head>

<body>
  <h1 class="title">cssの練習</h1>
  <p class="message">
    CSSを使うと、文字の色や大きさ、背景色などを変更できます。
  </p>
  <button class="btn">クリック</button>


</body>

</html>
