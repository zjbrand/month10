<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ナビゲーションバー</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .header {
      background-color: #2c3e50;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .nav a {
      color: white;
      text-decoration: none;
      margin-left: 24px;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .main {
      padding: 40px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">MySite</div>

    <nav class="nav">
      <a href="#">ホーム</a>
      <a href="#">サービス</a>
      <a href="#">会社情報</a>
      <a href="#">お問い合わせ</a>
    </nav>
  </header>

  <main class="main">
    <h1>ようこそ</h1>
    <p>これはナビゲーションバーの練習ページです。</p>
  </main>

</body>

</html>
